[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rasa-recommender"
version = "1.0.0"
description = "RASA - Relevance-Aware Shopping Assistant: mission-aware, constraint-aware, outcome-oriented product recommendation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andika", email = "andika@example.com" }]
keywords = ["recommender-system", "basket-optimization", "constraint-programming", "fastapi"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pandas>=2.2,<3",
  "numpy>=1.26,<2.0",
  "scikit-learn==1.4.1.post1",
  "scipy>=1.11",
  "pulp>=2.8,<4",
  "joblib>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.20",
  "ruff>=0.6",
]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that train models or run the full pipeline",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "artifacts", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
