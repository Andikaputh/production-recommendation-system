# Offline experiment and A/B simulation definitions (PRD section 11.6).
# Simulated A/B results must never be presented as causal evidence.

experiments:
  - experiment_id: EXP-001
    name: Global Popularity
    model: popularity_global
    strategy: popularity_global
    purpose: General baseline based on global popularity in the training data.
  - experiment_id: EXP-002
    name: Category Popularity
    model: popularity_category
    strategy: popularity_category
    purpose: Popularity baseline within mission-relevant categories.
  - experiment_id: EXP-003
    name: Content-Based
    model: content_tfidf
    strategy: content
    purpose: Measure the contribution of product metadata and descriptions.
  - experiment_id: EXP-004
    name: Collaborative Filtering
    model: cf_svd
    strategy: collaborative
    purpose: Measure the contribution of user interaction history.
  - experiment_id: EXP-005
    name: Hybrid
    model: hybrid_v1
    strategy: hybrid
    purpose: Measure the combination of collaborative, content, and quality signals.
  - experiment_id: EXP-006
    name: Hybrid + Mission Ranking
    model: hybrid_v1
    strategy: hybrid_mission
    purpose: Measure the contribution of mission and preference signals.
  - experiment_id: EXP-007
    name: Hybrid + Basket Optimization
    model: hybrid_v1
    strategy: hybrid_basket
    purpose: Measure the contribution of hard-constrained basket optimization.
  - experiment_id: EXP-008
    name: Hybrid + Controlled Exposure
    model: hybrid_v1
    strategy: hybrid_exposure
    purpose: Measure the trade-off between long-tail coverage and relevance.

ab_tests:
  - experiment_id: AB-001
    name: Mission Ranking A/B Simulation
    description: >-
      Simulated assignment of sessions to ranking variants. Results are
      simulation-only and do not establish causality.
    variants:
      control: hybrid
      treatment: hybrid_mission
    primary_metric: "ndcg@10"
    guardrail_metrics: ["precision@10", "catalog_coverage"]
    unit: session_id
    status: simulation_only
